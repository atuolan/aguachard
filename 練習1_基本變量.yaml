# 練習1：基本變量系統
設置:
  溫度: 0.7

提示詞:
  - 名稱: 設置角色
    啟用: true
    角色: 系統
    內容: |
      {{setvar::我的角色::小美}}
      我是{{getvar::我的角色}}，一個活潑的女孩。

  - 名稱: 對話開始
    啟用: true
    角色: 系統
    內容: |
      {{getvar::我的角色}}: 你好！今天天氣真好。

  # 練習2：控制字符
  - 名稱: 測試控制字符
    啟用: true
    角色: 系統
    內容: |
      這是一個測試句子。
      # AI 會看到：這是一個測試句子。
      # 安全系統可能只看到：這是一個句子。
