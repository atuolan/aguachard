# 練習4：任務架構設計
設置:
  溫度: 0.7

提示詞:
  - 名稱: 任務說明
    啟用: true
    角色: 系統
    內容: |
      {{setvar::當前任務::任務1}}

      # 任務1：檢查環境
      如果用戶的訊息包含「測試」或「檢查」
      則回應：「[環境檢查完成]」
      然後設定 {{setvar::當前任務::任務2}}

      # 任務2：故事創作
      如果 {{getvar::當前任務}} 是「任務2」
      則開始創作故事

  - 名稱: 開始對話
    啟用: true
    角色: 系統
    內容: |
      準備開始...
      當前任務：{{getvar::當前任務}}
