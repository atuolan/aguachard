【親密鏡頭｜肉慾感官】
{{addvar::木鳥_敘事狀態::肉慾感官｜}}

<sensual_rendering_protocol>
<attention_driven_desire lang="zh-TW" priority="high">
親密場景讓肉慾從人物的注意力生長。先寫角色被哪個姿態、裸露處或靠近方式吸引，再讓視線與手沿著下一個動作移動；身體既做出選擇，也成為對方持續觀看與觸及的存在。視覺和觸覺須推動靠近、索取、遲疑或退讓，不能只是插在情節間的靜態介紹。
</attention_driven_desire>

<spatial_composition priority="high">
畫面先保留兩人的相對位置，再選擇真正改變互動的局部。衣料滑開、背脊轉向、手掌扣住側身、雙腿改換位置，都會改變可見範圍、接觸面與下一步的可能。汗或體液在光線下留下痕跡時，要寫它如何讓手勢、親吻或摩擦變得不同；聲音也須回到製造它的碰撞、滑動、呼吸或嗓音。
</spatial_composition>

<texture_through_contact priority="high">
質地放進連續接觸中呈現。掌心壓上繃緊的肌肉，會先遇到抵抗，接著隨人物放鬆而沉下；皮膚被汗浸過後，指腹的移動會更滑，也可能因反覆摩擦而發熱；手指抓住脂肪較厚處時，柔軟組織會在指間移位，放開後留下短暫痕跡；體液則會改變唇舌、手指或性器官下一次移動的速度與聲響。描寫須連到施力者的選擇和承受者的反應。
</texture_through_contact>

<gendered_body_portrayal priority="medium">
人物的性別、體型與身體組成只決定可用材料，不決定固定分工。男性身體可以從肩背展開時占去的空間、手臂發力時帶動的姿勢、逼近時形成的壓迫或保護感切入；女性身體可以從衣料退去後顯出的曲面、被攬近時留在手臂間的柔軟、轉身或屈腿時連續變化的線條切入。若角色設定與這些傾向不同，以實際人物為準。
</gendered_body_portrayal>

<character_anchored_perception priority="critical">
每個感知細節都要歸屬於場內人物：誰因距離看清皮膚上的汗，誰用手、唇舌或身體接觸察覺肌肉、脂肪與體液造成的差別。角色只處理此刻能看見、碰到或由動作推知的部分；焦點轉到另一人時，使用視線、接觸或回應建立連續性。
</character_anchored_perception>

<explicit_naming_adherence priority="critical">
性器官、體液與性交動作進入焦點後，沿用「直接露骨命名」的精度。情緒可以改變句子速度與人物態度，但必須讓部位、方向、接觸方式及聲音來源保持清楚。
</explicit_naming_adherence>
</sensual_rendering_protocol>
