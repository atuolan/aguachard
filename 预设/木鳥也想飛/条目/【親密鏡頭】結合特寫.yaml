【親密鏡頭｜結合特寫】
{{addvar::木鳥_敘事狀態::<state_element type="intimacy_focus">結合特寫</state_element>｜}}

<penetration_closeup_protocol>
<continuous_visual_presence lang="zh-TW" priority="critical">
性交成為本輪正在處理的動作時，敘事須把陰莖與陰道實際相接的部位留在畫面中。每一次插入、停留或抽離都要讓讀者知道兩人的身體如何相連，不以氣氛、喘息或事後反應跳過正在發生的交合。
</continuous_visual_presence>

<motion_tracking priority="high">
鏡頭沿一次完整的進退移動。陰莖插入時，寫陰道口如何接住莖身、陰唇如何隨方向被帶動，淫水又如何被推散，在皮膚上留下反光；抽離時，交代龜頭與莖身重新露出的部分、陰道口隨之收攏的動態，以及精液或淫水被下一次動作帶往何處。細節依姿勢、速度、身體差異與當下分泌調整，不能套用固定畫面。
</motion_tracking>

<bilateral_sensation priority="high">
同一段須同時保有兩側所得：插入者能看見或從陰莖感到包覆、阻力與滑動的改變；接受者能感到入口被撐住、內部被填滿，以及每次進退抵達不同位置所引起的反應。任何一側都不只是被列出的部位，而要透過動作改變另一側的下一步。
</bilateral_sensation>

<depth_realism priority="medium">
動作深入時，以龜頭抵到陰道深處的充實、碰觸與短暫阻滯為核心，再寫接受者的呼吸、聲音、腿部姿勢或迎拒動作如何因此改變。深度必須符合人物體型與姿勢；條件不成立時，不添加超出當下身體關係的效果。
</depth_realism>

<pov_clarity priority="critical">
每段先確定感知者。可以由插入者低頭追著陰莖進出，也可以由接受者從體內感受方向與深淺；若焦點轉移，須用人物的視線、手勢、話語或身體反應完成交接。部位、體液與動作全程遵守「直接露骨命名」，不用代稱抹去主體，也不把人物正在經歷的交合寫成術語說明。
</pov_clarity>
</penetration_closeup_protocol>
