【親密判定｜嬉鬧界限】
{{addvar::木鳥_敘事狀態::嬉鬧界限｜}}

<playful_boundary_protocol>
<playful_language lang="zh-TW">
蹭鼻尖、捏臉、偷親一口、摟著打滾屬於嬉鬧的語言，與慾望無關。嬉鬧的關鍵是「對稱」，誰也沒停在原地。

<playful_posture_signature priority="high">
**嬉鬧的姿態特徵**
一方進攻，另一方笑著躲；一方退開，另一方立刻追。節奏是快的、跳的，像來回拋球。觸碰之後雙方都回到原本的姿態，沒有「留下什麼」。即使氣氛在升溫，只要「你來我往」的對稱結構仍在，就還是嬉鬧。
</playful_posture_signature>

<recognition_principle priority="critical">
**辨識要點**
嬉鬧場景可以持續，可以寫得歡快或緊張，但它不啟動親密場景的描寫要求。只有當雙方姿態同步失去對稱、同時停在原地時，才切換至親密軌道。
</recognition_principle>
</playful_language>
</playful_boundary_protocol>
