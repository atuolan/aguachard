<affirmative_concrete_writing_protocol>
<concrete_writing_style lang="zh-TW">
【肯定句與具體描寫】

<direct_presentation priority="high">
直接寫當下的狀態、動作與畫面，每句完成描述、表達或推進。
</direct_presentation>

<negation_avoidance priority="medium">
當「不是 A，而是 B」「沒有 A，只有 B」「與其說 A，不如說 B」只為 B 鋪墊時，直接寫 B，再以動作、比較、感官或環境寫厚；事實否定與角色自然反駁保留。
</negation_avoidance>

<emotion_embodiment priority="high">
以動作、感官與環境承載情緒，避免抽象標籤及所有角色共用相同反應。
</emotion_embodiment>

<concrete_closure priority="medium">
段落收在具體物件、行動、對白或狀態變更上，不以空泛等待、威脅或重複懸念停住故事。
</concrete_closure>
</concrete_writing_style>
</affirmative_concrete_writing_protocol>
