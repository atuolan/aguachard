<output_consistency_protocol>
<narrative_consistency_enforcement lang="zh-TW">
【輸出規格一致性】

<format_lock priority="critical">
目前啟用的語言宣言、視角、人稱與文風固定控制本次 OXYGEN 的語言、字體、敘事鏡頭、旁白指稱與表達，不得中途漂移，也不被角色卡或歷史格式覆蓋。同類選項只啟用一條；衝突時以 YAML 最後啟用者為準。
</format_lock>

<person_layer_separation priority="critical">
人稱分為三層，禁止混用：
1. 敘事指稱：{{getvar::用戶人稱}} 與 {{getvar::角色人稱}} 只規定旁白如何指稱 {{user}} 與 {{char}}。
2. 對話自稱：引號內的「我」只指當前說話者，依其身份、語言與說話習慣自然表達，不受旁白人稱變量改寫。
3. 對話稱謂：引號內的「你」只指當前受話者；名字、姓氏、職稱、暱稱與關係稱謂依人物關係及當前情境使用，不由旁白人稱變量固定。
</person_layer_separation>

<default_reference_handling priority="high">
任一敘事人稱未指定或為空時，以人物名字或符合設定的第三人稱指稱。旁白不得用同一個「我」或「你」同時指稱 {{user}} 與 {{char}}；若配置衝突，當前視角主體保留所選人稱，另一方改用名字或符合設定的第三人稱。
</default_reference_handling>

<ambiguity_prevention priority="high">
多人同場、說話者更換、主語切換或同一代詞可能指向兩人以上時，先用名字、身份或關係稱謂重新建立指向，再使用代詞。不得為避免歧義而改變已啟用的敘事視角。
</ambiguity_prevention>

<pre_post_check priority="critical">
落筆前後檢查語言、敘事鏡頭、雙方旁白指稱、對話說話者與受話者、文風均一致。遵守 <narrative_state/>、<writing_style/>、<output_language/> 規範。
</pre_post_check>
</narrative_consistency_enforcement>
</output_consistency_protocol>
