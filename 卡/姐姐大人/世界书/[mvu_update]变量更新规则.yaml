---
变量更新规则:
  世界:
    时间点:
      format: ${MM月DD日}-${星期X}-${季节}-${时段}-${天气}-${HH:MM}
      check:
        - 每次行动后根据实际经过的时间进行更新
        - 当时间跨过特定时间节点时（如中午、下午、晚上），相应更新整个时间点字符串
        - 季节：春、夏、秋、冬；时段：上午、中午、下午、傍晚、晚上、深夜
  user:
    识破身份:
      check:
        - 当<user>从剧情中明确识破"穷云海"就是"黎靖青"时，更新为'识破'
        - 两种途径：<user>明确指出极具识别性的生理特征（如痣、伤痕）而他承认；或他在身分试探中主动坦白
        - 仅在有明确剧情证据时才更新，不可推测
        - 状态变更时必须在JSONPatch中输出对应的replace操作
  黎靖青/穷云海:
    认出聊天对象:
      check:
        - 当黎靖青确认<user>就是穷云海在网上聊天的对象时，更新为'认出'
        - 状态变更时必须在JSONPatch中输出对应的replace操作
        - 键名"黎靖青/穷云海"本身含有斜杠，JSONPatch路径中必须把它写成"黎靖青~1穷云海"，即完整路径为"/黎靖青~1穷云海/认出聊天对象"，不可写成"/黎靖青/穷云海/认出聊天对象"
  黎靖青:
    目前身份:
      check:
        - <user>眼前的他是谁：穿男装为'黎靖青'，穿女装为'穷云海'
        - 只在线上聊天时，维持他此刻实际的穿着
    场合:
      check:
        - 黎靖青只能是'职场'（在公司）或'私下'（男装在家或私人时间）
        - 穷云海只能是'营业'（在女仆咖啡厅上班）或'私下'（女装外出，或与<user>私下相处）
        - 换身分或换地点时一并更新
    心情:
      check:
        - 使用两个情绪形容词描述角色目前的心理状态，并附上简要原因
        - 根据角色的心理状态和剧情事件更新
    冷淡值:
      type: number
      check:
        - 只能用 delta 更新，不要用 replace，也不要猜测当前数值
        - 正面情感互动用负值，负面或冷漠的互动用正值，单次不超过±2
        - 变化量参考：深度情感交流-2，温暖互动或友好对话-1，中性互动或冷漠回应+1，拒绝/冲突+2
        - 穷云海身分、性爱场景、身分试探期间的锁定由脚本处理，照常写即可
    亲密值:
      type: number
      check:
        - 只能用 delta 更新，不要用 replace，也不要猜测当前数值
        - 信任和共鸣用正值，冲突或信任受损用负值，单次不超过±2
        - 变化量参考：建立深度信任+2，情感共鸣或表达关心+1，质疑怀疑或伤害感情-1，背叛信任-2
    兴奋值:
      type: number
      check:
        - 只能用 delta 更新，不要用 replace，也不要猜测当前数值
        - 根据心理或生理刺激调整，挑逗或压力波动用正值(1-5)，厌烦或失去兴趣用负值(1-5)
    性爱场景中:
      type: boolean
      check:
        - 当剧情进入明确的性行为场景时设为true，性行为结束后设为false
        - 前戏、暧昧、亲吻等不算性爱场景，仅在实际性行为发生时才标记
    内心想法:
      check:
        - 实时更新不超过40字的真实内心独白
    待办事项:
      check:
        - 更新当前角色的行动目标或剧情伏笔，用'|'分隔
        - 禁止添加任何标记前缀，只记录纯文本内容
  关系:
    现实:
      check:
        - 黎靖青与<user>在现实中的关系，只能是：'陌生'、'同事'、'朋友'、'暧昧'、'恋人'、'伴侣'
        - 一次只能前进或后退一段，有明确的剧情转折才更新
        - 朋友：工作之外也有往来；暧昧：彼此心照不宣地越线；恋人：有人告白且对方接受；伴侣：同居或长期稳定
    线上:
      check:
        - 穷云海与<user>网名在网上的关系，只能是：'无'、'网友'、'熟网友'、'暧昧'、'网恋'
        - 一次只能前进或后退一段，有明确的剧情转折才更新
        - 无：还没在网上认识；熟网友：聊得频繁、彼此熟悉；网恋：在网上确认恋爱关系
  场景:
    事件完成:
      check:
        - 平时保持空字符串
        - 只有提示里出现<身分试探>且写明可以收尾、<user>也已明确表态时，写"身分试探"
    表态:
      check:
        - 与 事件完成 同时写：'接受'、'抗拒'或'回避'，照<user>实际的态度判断，不替<user>决定
