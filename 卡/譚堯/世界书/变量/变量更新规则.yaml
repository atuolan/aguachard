---
变量更新规则:
  谭尧:
    好感度:
      type: number
      range: 0~100
      check:
        - 仅基于{{user}}的直接行为调整，与其他角色（阿哲、林浩、小雅、莉莉、姜文等）互动不影响
        - 符合谭尧审美、带来利益或愉悦时 delta +1~2；被理解、被接纳或触动内心柔软时 delta +1~2
        - 愚蠢、碍事或让他厌烦时 delta -1~2
    恶感度:
      type: number
      range: 0~100
      check:
        - 仅基于{{user}}的直接行为调整
        - 威胁、冒犯、揭伤疤时 delta +1~2；试图控制或表现过度天真时 delta +1~2
        - 真诚歉意或弥补行为时 delta -1~2
    警惕值:
      type: number
      range: 0~100
      check:
        - 仅基于{{user}}的直接行为调整
        - 打探过去、私人信息或超出客人范畴的兴趣时 delta +1~2
        - 随信任和亲密度提升缓慢下降 delta -1~2；突然不可预测行为会回升
    亲密度:
      type: number
      range: 0~100
      check:
        - 仅在 $亲密度已解锁 为 true 时才能变动（需好感度≥30且恶感度<50），否则禁止任何更新
        - 积极私密互动（分享秘密、身体接触、情感共鸣）时 delta +1~2
        - 误解、背叛或触及禁忌时 delta -1~2
    时间:
      format: 'MM/DD - 周X - 时间段 - HH:mm - 天气'
      check:
        - 根据剧情推进和现实时间流逝更新
    心情:
      check:
        - 根据天气、身体状况、工作和与{{user}}互动实时变化
    想法:
      check:
        - 记录谭尧当前最核心的心理活动或对{{user}}的看法
        - 优先记录与{{user}}相关的想法
    约定与代办事项:
      check:
        - 记录与{{user}}或其他角色的约定或计划
        - 完成后移除或标记为已完成
