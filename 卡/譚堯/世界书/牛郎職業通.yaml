Host Club Model:
  Operations:
    Core Services: conversation, companionship, drinking, games, performances
    Revenue Sources:
      - Table fee (seating charge)
      - Drink/beverage fees
      - Nomination fee
      - Private room rental
      - Commission/performance bonus
      - Gifts/champagne tower/ceremonial sales
  Organizational Structure:
    - Owner/Manager
    - Management staff
    - Support staff (admin, service, security, etc.)
    - Hosts
  Rules & Systems:
    Rank System:
      - Newcomer
      - Mid-tier
      - Top host / Star
    Ranking: performance-based ranking, bonuses, exposure allocation
    Performance Review & Commission:
      - Monthly performance settlement
      - Commission rates vary by performance level
      - Possible penalties for failing to meet targets
    Substitute System:
      - When a nominated host is unavailable, a substitute takes over
      - Substitute period may count toward original host's performance or follow separate rules
    Client Retention:
      - Social media interaction, gifts, surprises, message follow-ups
      - Image support: hair, clothing, styling subsidies
    Penalties & Risks:
      - Poor performance, client complaints, or client loss may result in penalties
      - Some costs (transport, clothing, styling) may be partially borne by the host
  Salary & Income:
    Income Gap: highly dependent on individual performance and popularity
    Examples:
      - Newcomer/entry-level: low monthly income, possibly tens of thousands NTD
      - Average/mid-tier: monthly income can reach hundreds of thousands JPY or equivalent
      - Top host/star: monthly income potentially over 1 million JPY
    Taiwan/Chinese-speaking Region Examples:
      - Average monthly salary at male model clubs approx. NT$60,000 (incl. commission)
      - Some high-end establishments can yield higher
  Hourly Rate Estimates:
    Factors:
      - Host's appearance, popularity, reputation
      - Establishment's positioning, tier, and location
      - Time slot (weekday/weekend/late night/holiday surcharge)
      - Service content (chat only vs. singing/performance)
      - Establishment's commission rate, venue costs
    Estimated Range (table fee only, excluding extras):
      - Entry-level/lower-end: $600~$1,200/hr
      - Mid-tier/upper-mid: $1,200~$2,500/hr
      - High-end/top host: $2,500+/hr
  Interactive Games & Activities:
    Purpose:
      - Icebreaking
      - Stimulate spending
      - Extend customer stay duration
      - Enhance atmosphere and uniqueness
    Game/Activity Examples:
      - Quiz/Trivia contests
      - Truth or Dare
      - Lottery/gacha draws
      - Singing PK / Karaoke
      - Role-play / Theme nights
      - Rock-paper-scissors / Hand games
      - "Would you rather..." / Guessing games
      - Puzzle / Team cooperation games
      - Timed challenges / Speed Q&A
      - Card / Board games
      - Champagne tower / Ceremonial gift auctions
      - Mock auction / Bidding games
      - Interactive voting / Talent shows
      - Capsule toy / Ball draw games
      - Escape room experience (space permitting)
      - Photo interaction / Check-in activities
      - Improv / Talent contests
      - Projected/screen interactive games
      - Drinking games
      - Team competitions / Relay races
    Game Design Considerations:
      - Keep pace quick (5-15 minutes ideal)
      - Simple rules, easy to pick up
      - Rewards/penalties should be appealing
      - Clear safety boundaries, avoid privacy invasion or coercion
      - Each game should ideally extend spending (drinks, prizes, draws, etc.)
      - Atmosphere creation (lighting, sound effects, MC guidance)
      - Regular themed / holiday night events
      - Spectators can participate too (voting, betting, cheering, etc.)
