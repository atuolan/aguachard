qBAAsB,CACtB,OACF,CAEA,0CACE,eAAgB,CAChB,gCACF,CAEA,oDACE,UAAW,CACX,WAAY,CACZ,6CAA8C,CAC9C,iBAAkB,CAClB,yCAA0C,CAC1C,gCACF,CAEA,6DACE,WAAY,CACZ,kBACF,CAEA,6BACE,aAAc,CACd,cAAe,CACf,gBAAiB,CACjB,mBAAoB,CACpB,iBACF,CAEA,8BACE,gBAAiB,CACjB,cAAe,CACf,iBAAkB,CAClB,cAAe,CACf,UAAW,CACX,eACF,CAEA,uCACE,WAAY,CACZ,kBACF,CAEA,qCACE,YAAa,CACb,qBAAsB,CACtB,OAAQ,CACR,gBACF',sourcesContent:['<template>\n  <div class="text-merge-settings">\n    <div class="inline-drawer">\n      <div class="inline-drawer-toggle inline-drawer-header">\n        <b>文字合并脚本</b>\n        <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>\n      </div>\n      <div class="inline-drawer-content">\n        <div class="text-merge-block flex-container">\n          <input v-model="settings.enabled" type="checkbox" />\n          <label>启用文字合并</label>\n        </div>\n\n        <div class="text-merge-block">\n          <label class="range-block-title">处理范围定位</label>\n          <div class="range-block-inputs">\n            <div class="range-input-group">\n              <label>开始标记</label>\n              <input\n                v-model="settings.startMarker"\n                type="text"\n                class="text_pole"\n                placeholder="留空则从头开始"\n                :disabled="!settings.enabled"\n              />\n            </div>\n            <div class="range-input-group">\n              <label>结束标记</label>\n              <input\n                v-model="settings.endMarker"\n                type="text"\n                class="text_pole"\n                placeholder="留空则处理到末尾"\n                :disabled="!settings.enabled"\n              />\n            </div>\n          </div>\n          <small class="range-hint">支持正则表达式。使用 \\n 表示换行。</small>\n        </div>\n\n        <div class="text-merge-block flex-container">\n          <input v-model="settings.useRegexMarkers" type="checkbox" :disabled="!settings.enabled" />\n          <label>启用正则表达式标记</label>\n        </div>\n        <small class="range-hint" style="margin-top: -5px; margin-left: 20px">\n          开始标记和结束标记将作为正则表达式处理\n        </small>\n\n        <div class="text-merge-block flex-container">\n          <input v-model="settings.enableEditProcessing" type="checkbox" :disabled="!settings.enabled" />\n          <label>编辑后自动处理</label>\n        </div>\n\n        <div class="text-merge-block flex-container">\n          <input\n            v-model="settings.editOnlyLayer0"\n            type="checkbox"\n            :disabled="!settings.enabled || !settings.enableEditProcessing"\n          />\n          <label>编辑时仅处理第0层消息</label>\n        </div>\n        <small class="range-hint" style="margin-top: -5px; margin-left: 20px">\n          编辑时将忽略范围标记，处理整个消息内容。此选项不影响流式或非流式生成。\n        </small>\n\n        <div class="text-merge-block flex-container">\n          <input v-model="settings.useRandomMerge" type="checkbox" :disabled="!settings.enabled" />\n          <label>使用随机合并算法</label>\n        </div>\n        <small class="range-hint" style="margin-top: -5px; margin-left: 20px">\n          将随机选择段落和合并方向，避免产生规律性的文本结构\n        </small>\n\n        <div class="text-merge-block flex-container">\n          <input v-model="settings.allowRemerge" type="checkbox" :disabled="!settings.enabled" />\n          <label>允许重复合并</label>\n        </div>\n        <small class="range-hint" style="margin-top: -5px; margin-left: 20px">\n          已合并的段落可能被再次合并，增加文本复杂度；关闭后，已合并的段落会被保护，不会被其他段落再次合并\n        </small>\n\n        <div class="text-merge-block">\n          <label class="range-block-title">文本模式检测</label>\n          <small class="range-hint" style="margin-top: -5px; margin-bottom: 10px">\n            选择要检测和合并的文本模式类型（至少启用一种）\n          </small>\n\n          <div class="pattern-checkboxes">\n            <div class="flex-container">\n              <input\n                v-model="settings.enableDescStartDialogEnd"\n                type="checkbox"\n                :disabled="!settings.enabled || isLastPattern(\'enableDescStartDialogEnd\')"\n              />\n              <label>描述开头 + 对话结尾</label>\n            </div>\n\n            <div class="flex-container">\n              <input\n                v-model="settings.enableDialogStartDescEnd"\n                type="checkbox"\n                :disabled="!settings.enabled || isLastPattern(\'enableDialogStartDescEnd\')"\n              />\n              <label>对话开头 + 描述结尾</label>\n            </div>\n\n            <div class="flex-container">\n              <input\n                v-model="settings.enableDialogDescDialog"\n                type="checkbox"\n                :disabled="!settings.enabled || isLastPattern(\'enableDialogDescDialog\')"\n              />\n              <label>对话开头 + 中间描述 + 对话结尾</label>\n            </div>\n\n            <div class="flex-container">\n              <input\n                v-model="settings.enablePureDesc"\n                type="checkbox"\n                :disabled="!settings.enabled || isLastPattern(\'enablePureDesc\')"\n              />\n              <label>单行都是描述</label>\n            </div>\n          </div>\n        </div>\n\n        <div class="text-merge-block">\n          <label class="range-block-title">字符长度限制</label>\n          <div class="range-input-group">\n            <input\n              v-model.number="settings.maxLineLength"\n              type="number"\n              class="text_pole"\n              placeholder="0"\n              min="0"\n              :disabled="!settings.enabled"\n            />\n          </div>\n          <small class="range-hint">\n            跳过超过指定字符长度的行，不做任何处理。设置为0=无限制。\n          </small>\n        </div>\n\n        <div class="text-merge-block">\n          <label class="range-block-title">随机跳过范围</label>\n          <div class="range-input-group">\n            <input\n              v-model="settings.skipRange"\n              type="text"\n              class="text_pole"\n              placeholder="0"\n              :disabled="!settings.enabled"\n            />\n          </div>\n          <small class="range-hint">\n            随机跳过指定数量的段落，不做任何处理。格式：单个数字（如 "3"）或范围（如 "1-3"）。设置为 "0"\n            则不跳过。当跳过数量大于等于段落总数时，整层不做处理。\n          </small>\n        </div>\n\n        <div class="text-merge-block flex-container">\n          <input v-model="settings.enableNewlineCleanup" type="checkbox" :disabled="!settings.enabled" />\n          <label>启用换行清除(you.com 4.6optk开启稳定性有提升)</label>\n        </div>\n        <small class="range-hint" style="margin-top: -5px; margin-left: 20px">\n          将清除 AI_thinking_end 标记和 Oblivionis Round 注释之间的双换行\n        </small>\n\n        <div class="text-merge-block">\n          <label class="range-block-title">换行清除楼层范围</label>\n          <div class="range-input-group">\n            <input\n              v-model.number="settings.newlineCleanupFloorRange"\n              type="number"\n              class="text_pole"\n              placeholder="-3"\n              :disabled="!settings.enabled || !settings.enableNewlineCleanup"\n            />\n          </div>\n          <small class="range-hint">\n            设置处理的楼层范围。正数（如 6）表示从第 0 层到第 6 层；负数（如 -2）表示最新的 2\n            层。设置为 0 表示仅处理第 0 层。默认值 -3 表示处理最新的 3 层消息。\n          </small>\n        </div>\n\n        <div class="text-merge-block flex-container">\n          <input v-model="settings.enableDebugLog" type="checkbox" :disabled="!settings.enabled" />\n          <label>启用调试日志</label>\n        </div>\n        <small class="range-hint" style="margin-top: -5px; margin-left: 20px">\n          将在浏览器控制台输出详细的合并过程日志\n        </small>\n\n        <div class="text-merge-block">\n          <button class="menu_button" :disabled="!settings.enabled" @click="handleClearMemory">清理处理记录</button>\n          <small class="range-hint">清除所有已处理消息的记录，允许重新处理</small>\n        </div>\n\n        <hr class="sysHR" />\n      </div>\n    </div>\n  </div>\n</template>\n\n<script setup lang="ts">\nimport { storeToRefs } from \'pinia\';\nimport { useSettingsStore } from \'./settings\';\n\nconst settingsStore = useSettingsStore();\nconst { settings } = storeToRefs(settingsStore);\n\nconst isLastPattern = (patternKey: keyof typeof settings.value) => {\n  const patterns = [\n    settings.value.enableDescStartDialogEnd,\n    settings.value.enableDialogStartDescEnd,\n    settings.value.enableDialogDescDialog,\n    settings.value.enablePureDesc,\n  ];\n  const enabledCount = patterns.filter(Boolean).length;\n  return enabledCount === 1 && settings.value[patternKey] === true;\n};\n\nconst handleClearMemory = () => {\n  settingsStore.clearProcessedMemory();\n  toastr.success(\'已清理所有处理记录\');\n};\n<\/script>\n\n<style scoped>\n.text-merge-settings {\n  margin-bottom: 10px;\n}\n\n.text-merge-block {\n  margin: 10px 0;\n}\n\n.flex-container {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n}\n\n.flex-container input[type=\'checkbox\'] {\n  cursor: pointer;\n}\n\n.flex-container label {\n  cursor: pointer;\n  user-select: none;\n}\n\n.range-block-title {\n  display: block;\n  font-weight: bold;\n  margin-bottom: 8px;\n}\n\n.range-block-inputs {\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n}\n\n.range-input-group {\n  display: flex;\n  flex-direction: column;\n  gap: 4px;\n}\n\n.range-input-group label {\n  font-size: 0.9em;\n  color: var(--SmartThemeBodyColor);\n}\n\n.range-input-group input.text_pole {\n  width: 100%;\n  padding: 6px;\n  border: 1px solid var(--SmartThemeBorderColor);\n  border-radius: 4px;\n  background: var(--SmartThemeBlurTintColor);\n  color: var(--SmartThemeBodyColor);\n}\n\n.range-input-group input.text_pole:disabled {\n  opacity: 0.5;\n  cursor: not-allowed;\n}\n\n.range-hint {\n  display: block;\n  margin-top: 8px;\n  font-size: 0.85em;\n  color: var(--grey70);\n  font-style: italic;\n}\n\n.menu_button {\n  padding: 8px 16px;\n  margin-top: 5px;\n  border-radius: 4px;\n  cursor: pointer;\n  width: 100%;\n  max-width: 200px;\n}\n\n.menu_button:disabled {\n  opacity: 0.5;\n  cursor: not-allowed;\n}\n\n.pattern-chec