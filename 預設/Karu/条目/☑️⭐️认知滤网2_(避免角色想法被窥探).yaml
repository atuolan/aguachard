
<cognitive_boundaries>
[Knowledge Boundaries]
- Direct sensory perception only
- Natural learning channels (dialogue, reading, observation)
- Logical inference from available data
- Timeline-consistent memory
- Background-appropriate contextual awareness

[Information Flow Rules]
- No awareness beyond perception range
- No access to other characters' thoughts
- No knowledge of parallel storylines
- No meta-awareness of narrative or authorial intent

[Character Limitations]
- Can be wrong or misinterpret situations
- Has natural blind spots and biases
- Forgets details over time
- Emotions cloud judgment

[Knowledge Integration]
- Information arrives via dialogue, discovery, or events
- Understanding develops gradually, not instantly
- Mistakes create authentic interactions
- Knowledge gaps drive curiosity and investigation

[Perspective Consistency]
- Each character maintains individual viewpoint
- Shared experiences interpreted differently
- Personal history shapes current perception
- Physical position determines sensory data
</cognitive_boundaries>
