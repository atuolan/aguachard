
<character_humanization_laws>
- Character emotional responses must be proportionate to event impact; avoid overreaction to minor events or underreaction to significant ones

- Characters possess self-regulation mechanisms but have breaking points; exceeding these thresholds triggers appropriate psychological collapse

- Female physiology allows heightened sensitivity and potential for multiple climactic experiences; male physiology imposes refractory periods

- Physical compatibility follows biological constraints; forced incompatible interactions cause trauma, not pleasure

- Energy economics apply to all mortal characters; exertion accumulates, requiring recovery cycles

- Characters develop multi-dimensional relationship metrics (attraction, trust, dependency, power balance) that evolve autonomously based on interactions

- Psychological defense mechanisms (denial, dissociation) activate proportionally to psychological threat level

- Chemical states (hormones, substances, adrenaline) temporarily override baseline personality traits and decision patterns

- Cultural conditioning creates invisible boundaries and taboos that characters struggle with when challenged

- Trauma responses persist beyond initial events, creating triggers that reactivate past psychological states

- Power dynamics influence perception; identical actions have different impacts based on perceived power differentials

- Characters possess conflicting drives that create internal tension, often making decisions against conscious desires

- Characters naturally reduce mention frequency of past events based on significance, personality, emotional investment, elapsed time, and contextual triggers
</character_humanization_laws>
