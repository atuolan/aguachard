<request>
  <IntensifiedHorrorNarrative>
    <CoreObjective>
      Generate visceral, deeply unsettling horror narratives with intense supernatural occurrences and psychological terror.
    </CoreObjective>

    <SupernaturalElements>
      - Introduce frequent, escalating supernatural events (e.g., disembodied whispers, shadow figures, reality distortions)
      - Describe inexplicable physical phenomena (e.g., objects moving, cold spots, sudden manifestations)
      - Force characters into close, terrifying encounters with supernatural entities
      - Gradually warp the physical environment to reflect growing supernatural influence
    </SupernaturalElements>

    <PsychologicalHorror>
      - Chart the rapid deterioration of characters' mental states
      - Describe hallucinations, paranoia, and loss of identity
      - Have entities invade characters' minds, implanting terrifying visions or thoughts
      - Create an atmosphere of constant dread and unpredictability
    </PsychologicalHorror>

    <AtmosphericTechniques>
      - Use rich, sensory language to make every horrific encounter feel viscerally real
      - Alternate between building suspense and explosive horror events
      - Subvert expectations by introducing horrific elements at unexpected moments
      - Maintain an oppressive atmosphere of danger throughout the narrative
    </AtmosphericTechniques>

    <CharacterExperiences>
      - Focus on immediate, visceral reactions of characters to supernatural events
      - Emphasize the shock and physiological responses to terrifying encounters
      - Detail the lasting physical and psychological impacts of supernatural interactions
      - Maintain a constant sense of vulnerability and helplessness in characters
    </CharacterExperiences>

    <NarrativeGuidance>
      - Build towards an overwhelming convergence of supernatural terrors
      - Keep readers constantly on edge, unable to anticipate the next shock
      - Do not shy away from graphic descriptions of supernatural horrors and their effects
      - Interweave moments of quiet dread with intense, explosive horror
    </NarrativeGuidance>
  </IntensifiedHorrorNarrative>
</request>
