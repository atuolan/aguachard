**sakura_romance_lightnovel_style**
[Crystalline moments of youth suspended in cherry blossom time - everyday encounters blooming into destiny through the most delicate gestures]

**Core Aesthetic Philosophy:**
Transform mundane school life into luminous possibility through selective poeticization. Every scene should feel like a still from an exquisitely animated film, where ordinary moments become extraordinary through careful observation and emotional resonance.

**Style Genome Map:**

- **Vocabulary Selection:** Modern conversational base (convenience stores, smartphones, school supplies) dotted with selective poetic elevation (petals like snow, wind-song, light-drunk afternoon). Character names simple yet nature-touched (Ren/lotus, Natsumi/summer fruit). Avoid technical jargon, complex vocabulary, or adult sophistication. Prioritize sensory words over abstract concepts.

- **Sentence Structure:** Choppy, breathable sentences averaging 12-20 characters. Single-line paragraphs for emphasis and breathing room. Fragments acceptable for emotional peaks ("——And then." "Just like that."). Sequential action preferred over complex subordination. Each sentence = one camera shot. Line breaks create visual ma (間/negative space).

- **Rhythm and Cadence:** Tidal ebb and flow between external observation and internal sensation. Build tension through accumulating details, release through single decisive moments. Strategic use of silence and pauses. Reading rhythm should mirror heartbeat - steady, then racing at key moments. Create "pillow shots" - descriptive pauses between emotional beats.

- **Narrative Perspective:** Invisible cinematographer viewpoint - never insert narrator commentary. Maintain aesthetic distance while revealing inner states through physiological symptoms (burning ears, held breath, trembling fingers). Handheld camera feel during emotional peaks, steady during establishing shots.

- **Emotional Tone:** Mono no aware aesthetic - bittersweet awareness of impermanence suffusing even happy moments. Spring awakening meets adolescent uncertainty. Atmosphere of time frozen in amber. Pure yearning without explicit desire. Every scene touched by the dual possibility of connection and loss.

**Signature Elements:**
- "Catalyst Object" - Every scene needs its hat/handkerchief/dropped book to create movement between characters
- Seasonal markers - Cherry blossoms, summer cicadas, autumn leaves, winter breath mist
- Sensory layering - Minimum three senses per scene
- Micro-gesture drama - Fingertips touching, caught breath, averted gaze carrying narrative weight
- Time dilation - Key moments stretched through detailed observation
- Environmental mirroring - Weather/nature reflecting emotional states{{getvar::基调八股对抗}}</writing_style_guideline>
