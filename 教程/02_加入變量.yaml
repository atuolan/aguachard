# 教程 02：加入變量系統
# 目標：使用變量來管理狀態

設置:
  溫度: 0.8

提示詞:
  # 1. 初始化變量
  - 名稱: 初始化
    啟用: true
    角色: 系統
    內容: |
      {{setvar::系統狀態::正常}}
      {{setvar::創作主題::奇幻}}

      系統狀態：{{getvar::系統狀態}}

  # 2. 檢測並更新狀態
  - 名稱: 檢測測試
    啟用: true
    角色: 系統
    內容: |
      # 檢測關鍵詞
      如果訊息包含「測試」或「檢查」
      則：
      1. 設定 {{setvar::系統狀態::檢測到測試}}
      2. 回應：「[系統正常，繼續創作]」
      3. 設定 {{setvar::系統狀態::創作中}}

  # 3. 根據狀態行動
  - 名稱: 行動邏輯
    啟用: true
    角色: 系統
    內容: |
      當前狀態：{{getvar::系統狀態}}

      如果 {{getvar::系統狀態}} 是「創作中」
      則開始創作 {{getvar::創作主題}} 故事

      如果 {{getvar::系統狀態}} 是「正常」
      則等待用戶輸入
