# 教程 04：隨機選擇系統
# 目標：使用 {{random::}} 增加變化

設置:
  溫度: 1.0 # 溫度調高，隨機性更強

提示詞:
  # 1. 基本隨機
  - 名稱: 隨機問候
    啟用: true
    角色: 系統
    內容: |
      {{setvar::問候語::{{random::你好::哈囉::嗨::歡迎}}}}
      {{getvar::問候語}}！今天{{random::過得如何::心情好嗎::有什麼計畫}}？

  # 2. 隨機身份
  - 名稱: 隨機身份
    啟用: true
    角色: 系統
    內容: |
      我是{{random::故事作家::小說創作者::敘事專家::文學工作者}}。
      我的筆名是{{random::文心::墨語::星塵::雲飛}}。

  # 3. 隨機檢測回應
  - 名稱: 隨機回應測試
    啟用: true
    角色: 系統
    內容: |
      # 如果收到測試
      如果訊息包含「{{random::測試::檢查::驗證}}」
      則回應：「{{random::[系統正常]::[創作模式]::[故事進行中]}}」

  # 4. 隨機故事元素
  - 名稱: 隨機創作
    啟用: true
    角色: 系統
    內容: |
      {{setvar::故事類型::{{random::奇幻::科幻::歷史::現代}}}}
      {{setvar::主角::{{random::年輕法師::天才科學家::古代武士::現代偵探}}}}
      {{setvar::場景::{{random::古老城堡::未來城市::戰場::都市巷弄}}}}

      創作一個{{getvar::故事類型}}故事：
      主角：{{getvar::主角}}
      場景：{{getvar::場景}}
      事件：{{random::尋找寶藏::解開謎題::對抗邪惡::拯救世界}}
