          - '【視角・用戶】02｜第二人稱'
          - '【視角・用戶】03｜第三人稱'
          - '【視角・角色】01｜第一人稱'
          - '【視角・角色】02｜第二人稱'
          - '【視角・角色】03｜第三人稱'
      - 名称: 文風
        条目:
          - '【文風・五選一】01｜白描暗湧'
          - '【文風・五選一】02｜溫厚留白'
          - '【文風・五選一】03｜曖昧拉扯'
          - '【文風・五選一】04｜古風言情'
          - '【文風・五選一】05｜江湖武俠'
      - 名称: 角色定義區
        条目:
          - '<User Information>'
          - '</User Information>'
          - '<Char Information>'
          - 'Enhance Definitions'
          - 'Auxiliary Prompt'
          - '</char Information>'

  - 名称: 敘事補充
    类型: 范围
    起始: '【敘事補充】01｜拒絕獵食展演'
    结束: '【敘事補充】04｜去威脅表達'

  - 名称: 體態
    类型: 范围
    起始: '【體態・四選一】01｜女性身體・日常通用'
    结束: '【體態・四選一】04｜女性身體・現代親密'

  - 名称: 親密文風
    类型: 范围
    起始: '【親密文風・六選一】01｜高度衝擊與言語羞辱'
    结束: '【親密文風・六選一】06｜溫柔直接'

  - 名称: 親密詞彙與鏡頭
    类型: 范围
    起始: '【親密詞彙】直接露骨命名'
    结束: '【親密判定】嬉鬧界限'

  - 名称: 輸出語言與字數
    类型: 范围
    起始: '【輸出語言補充】萬國語言'
    结束: '【正文字數】'

  - 名称: 執行鏈
    类型: 范围
    起始: '【執行】50｜完成當前期望'
    结束: '【執行】54B｜用戶確認輸出'

