# yaml-language-server: $schema=./schema.json


维度:
  語言宣言:
    - '【語言・六選一】01｜英文宣言'
    - '【語言・六選一】02｜日文宣言'
    - '【語言・六選一】03｜德文宣言'
    - '【語言・六選一】04｜俄文宣言'
    - '【語言・六選一】05｜文言文宣言'
    - '【語言・六選一】06｜繁體中文宣言'

  敘事視角:
    - '【視角・用戶】01｜第一人稱'
    - '【視角・用戶】02｜第二人稱'
    - '【視角・用戶】03｜第三人稱'
    - '【視角・角色】01｜第一人稱'
    - '【視角・角色】02｜第二人稱'
    - '【視角・角色】03｜第三人稱'

  文風:
    - '【文風・五選一】01｜白描暗湧'
    - '【文風・五選一】02｜溫厚留白'
    - '【文風・五選一】03｜曖昧拉扯'
    - '【文風・五選一】04｜古風言情'
    - '【文風・五選一】05｜江湖武俠'

  親密文風:
    - '【親密文風・六選一】01｜高度衝擊與言語羞辱'
    - '【親密文風・六選一】02｜典雅雲雨'
    - '【親密文風・六選一】03｜典雅詩意'
    - '【親密文風・六選一】04｜中度SM與心理支配'
    - '【親密文風・六選一】05｜即時第一人稱自述'
    - '【親密文風・六選一】06｜溫柔直接'

  體態:
    - '【體態・四選一】01｜女性身體・日常通用'
    - '【體態・四選一】02｜豐滿女性・棉花糖體型'
    - '【體態・四選一】03｜有孕女性'
    - '【體態・四選一】04｜女性身體・現代親密'

  輸出語言:
    - '【輸出語言・二選一】01｜繁體中文'
    - '【輸出語言・二選一】02｜簡體中文'

  搶話代筆:
    - '【規則】48B｜完全不可搶話代筆'
    - '【規則】48C｜僅轉述潤色'
    - '【規則】48D-1｜完整小說代筆・轉述版'
    - '【規則】48D-2｜完整小說代筆・直接延續版'

场景方案:
  - 名称: 溫柔日常
    说明: 預設組合：溫厚留白文風＋溫柔直接的親密筆法，適合日常溫馨路線。
    开启:
      文風: '【文風・五選一】02｜溫厚留白'
      親密文風: '【親密文風・六選一】06｜溫柔直接'

  - 名称: 曖昧拉扯
    说明: 曖昧拉扯文風＋典雅詩意，把張力留在未說破的距離裡。
    开启:
      文風: '【文風・五選一】03｜曖昧拉扯'
      親密文風: '【親密文風・六選一】03｜典雅詩意'

  - 名称: 古風言情
    说明: 古風言情文風＋典雅雲雨，含蓄又入骨的古典雲雨。
    开启:
      文風: '【文風・五選一】04｜古風言情'
      親密文風: '【親密文風・六選一】02｜典雅雲雨'

  - 名称: 江湖武俠
    说明: 江湖武俠文風＋典雅詩意，刀尖上的情義與隱晦筆法。
    开启:
      文風: '【文風・五選一】05｜江湖武俠'
      親密文風: '【親密文風・六選一】03｜典雅詩意'

  - 名称: 白描暗湧
    说明: 白描暗湧文風＋溫柔直接，鏡頭克制但情緒直給。
    开启:
      文風: '【文風・五選一】01｜白描暗湧'
      親密文風: '【親密文風・六選一】06｜溫柔直接'

  - 名称: 支配調教
    说明: 白描暗湧文風，同時開啟兩種支配系親密文風。
    警告: >-
      本場景同時開啟「高度衝擊與言語羞辱」與「中度SM與心理支配」兩種
      若與「敘事補充01 拒絕獵食展演」的界線衝突，以用戶輸入
      與角色共識為準。切回其它場景即可恢復單一文風。
    开启:
      文風: '【文風・五選一】01｜白描暗湧'
      親密文風:
        - '【親密文風・六選一】01｜高度衝擊與言語羞辱'
        - '【親密文風・六選一】04｜中度SM與心理支配'

常驻配置:
  - 键: chant
    标签: 宣言語言
    默认: english
    选项:
      - 值: english
        标签: 英文
        开启: { 語言宣言: '【語言・六選一】01｜英文宣言' }
      - 值: japanese
        标签: 日文
        开启: { 語言宣言: '【語言・六選一】02｜日文宣言' }
      - 值: german
        标签: 德文
        开启: { 語言宣言: '【語言・六選一】03｜德文宣言' }
      - 值: russian
        标签: 俄文
        开启: { 語言宣言: '【語言・六選一】04｜俄文宣言' }
      - 值: literary
        标签: 文言文
        开启: { 語言宣言: '【語言・六選一】05｜文言文宣言' }
      - 值: chinese
        标签: 繁體中文
        开启: { 語言宣言: '【語言・六選一】06｜繁體中文宣言' }

  - 键: pov
    标签: 敘事視角
    默认: user_second
    选项:
      - 值: user_first
        标签: 用戶第一人稱
        开启: { 敘事視角: '【視角・用戶】01｜第一人稱' }
      - 值: user_second
        标签: 用戶第二人稱
        开启: { 敘事視角: '【視角・用戶】02｜第二人稱' }
      - 值: user_third
        标签: 用戶第三人稱
        开启: { 敘事視角: '【視角・用戶】03｜第三人稱' }
      - 值: char_first
        标签: 角色第一人稱
        开启: { 敘事視角: '【視角・角色】01｜第一人稱' }
      - 值: char_second
        标签: 角色第二人稱
        开启: { 敘事視角: '【視角・角色】02｜第二人稱' }
      - 值: char_third
        标签: 角色第三人稱
        开启: { 敘事視角: '【視角・角色】03｜第三人稱' }

  - 键: body
    标签: 體態
    默认: daily
    选项:
      - 值: none
        标签: 無特化
        开启: { 體態: 无 }
      - 值: daily
        标签: 日常通用
        开启: { 體態: '【體態・四選一】01｜女性身體・日常通用' }
      - 值: plump
        标签: 棉花糖體型
        开启: { 體態: '【體態・四選一】02｜豐滿女性・棉花糖體型' }
      - 值: pregnant
        标签: 有孕
        开启: { 體態: '【體態・四選一】03｜有孕女性' }
      - 值: modern
        标签: 現代親密
        开启: { 體態: '【體態・四選一】04｜女性身體・現代親密' }

  - 键: lang
    标签: 輸出語言
    默认: traditional
    选项:
      - 值: traditional
        标签: 繁體中文
        开启: { 輸出語言: '【輸出語言・二選一】01｜繁體中文' }
      - 值: simplified
        标签: 簡體中文
        开启: { 輸出語言: '【輸出語言・二選一】02｜簡體中文' }

  - 键: ghost
    标签: 搶話代筆
    默认: novel
    选项:
      - 值: strict
        标签: 完全不可搶話代筆
        开启: { 搶話代筆: '【規則】48B｜完全不可搶話代筆' }
      - 值: transcribe
        标签: 僅轉述潤色
        开启: { 搶話代筆: '【規則】48C｜僅轉述潤色' }
      - 值: novel
        标签: 完整小說代筆・轉述版
        开启: { 搶話代筆: '【規則】48D-1｜完整小說代筆・轉述版' }
      - 值: direct
        标签: 完整小說代筆・直接延續版
        开启: { 搶話代筆: '【規則】48D-2｜完整小說代筆・直接延續版' }

  - 键: intimacy
    标签: 親密文風
    多选: true
    默认:
      - gentle
    选项:
      - 值: impact
        标签: 高度衝擊與言語羞辱
        开启: { 親密文風: '【親密文風・六選一】01｜高度衝擊與言語羞辱' }
      - 值: classical
        标签: 典雅雲雨
        开启: { 親密文風: '【親密文風・六選一】02｜典雅雲雨' }
      - 值: poetic
        标签: 典雅詩意
        开启: { 親密文風: '【親密文風・六選一】03｜典雅詩意' }
      - 值: sm
        标签: 中度SM與心理支配
        开启: { 親密文風: '【親密文風・六選一】04｜中度SM與心理支配' }
      - 值: firstperson
        标签: 即時第一人稱自述
        开启: { 親密文風: '【親密文風・六選一】05｜即時第一人稱自述' }
      - 值: gentle
        标签: 溫柔直接
        开启: { 親密文風: '【親密文風・六選一】06｜溫柔直接' }

分组:
  - 名称: 核心與宣言
    类型: 范围
    起始: '【語言初始化】00｜清空宣言變量（固定啟用）'
    结束: '【語言・六選一】06｜繁體中文宣言'

  - 名称: 劇情與木鳥宣言
