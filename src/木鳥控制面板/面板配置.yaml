  - 名称: 規則
    类型: 范围
    起始: '【規則】42｜角色主體性'
    结束: '【規則】50｜輸出規格一致性'

  - 名称: 氧氣屏障
    类型: 标记包裹
    起始: '【氧氣屏障】 '
    结束: '【/氧氣屏障】'
    子分类:
      - 名称: 敘事視角
        条目:
